<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Items</title>
    <link href="style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="mainpage">
        <section class="browse-intro">
            <h1>
                Browse lost and found items
            </h1>

            <p class="browse-description">
                Search for the items that have been reported lost or found
            </p>
        </section>
        <form action="index.php" method="GET">
            <label for="search">Search for items:</label>
            <input type="text" id="search" name="search" placeholder="Enter item name or category">
            <br>

            <label for="lost-or-found">Filter by status:</label>
            <select id="lost-or-found" name="lost-or-found">
                <option value="">Both Lost & Found</option>
                <option value="lost">Lost</option>
                <option value="found">Found</option>
            </select>
            <button type="submit">Search</button> 
    </form>
    <script src="script.js"></script>
</body>
</html>
