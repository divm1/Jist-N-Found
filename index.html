<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost&Found Demo</title>
    <link href="style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
</head>
<body>
    <div id="header-placeholder"></div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
    <main class="mainpage">
        <section class="intro">
            <h1>Welcome to Findesk</h1>
            <p class="intro-description">
                What shall we start with first?
            </p>
        </section>
    
    <div class="container swiper">
        <div class="sliderwrapper">
            <div class="cardlist swiper-wrapper">
                <div class="carditem swiper-slide">
                    <h2 class="cardtitle">Lost Something?</h2>
                <p class="carddescription">
                    Report your lost items and help others find what they're looking for.
                </p>
                <button class="cardbutton">
                    Report Lost Item
                </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
